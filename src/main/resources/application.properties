spring.application.name=voice-budget-api
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.model.audio.speech=elevenlabs
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.model=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.max-completion-tokens=1024
spring.ai.openai.chat.reasoning-effort=low
spring.ai.openai.chat.replay-reasoning-content=false
spring.ai.openai.audio.transcription.model=whisper-large-v3
spring.ai.openai.audio.transcription.language=pt

spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
spring.ai.elevenlabs.tts.model-id=eleven_flash_v2_5
spring.ai.elevenlabs.tts.voice-id=${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}
spring.ai.elevenlabs.tts.language-code=pt
spring.ai.elevenlabs.tts.output-format=mp3_44100_128

budget.time-zone=America/Sao_Paulo
