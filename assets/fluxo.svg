<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="fluxo-title fluxo-desc">
  <title id="fluxo-title">Do áudio à resposta em voz</title>
  <desc id="fluxo-desc">O áudio chega em POST /assistant/voice. O AssistantService (Facade) transcreve o áudio com o TranscriptionModel (Whisper na Groq), pede a resposta ao BudgetAssistant (ChatClient com memória, LLM na Groq) e salva a interação. A IA usa Tool Calling para chamar o BudgetTools (Adapter), que usa o TransactionService e o PostgreSQL. Depois, GET /assistant/interactions/{id}/speech gera o MP3 com o TextToSpeechModel (ElevenLabs).</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#690037"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="788" rx="18" fill="#FFFFFF" stroke="#FAB9FF" stroke-width="2"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="58" font-size="26" font-weight="700" fill="#690037">Do áudio à resposta em voz</text>

    <rect x="40" y="105" width="250" height="70" rx="35" fill="#FA5A50"/>
    <text x="165" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">“Gastei 45 reais no mercado”</text>
    <text x="165" y="198" text-anchor="middle" font-size="13" fill="#6B4A5A">áudio gravado (m4a, mp3, wav...)</text>
    <line x1="290" y1="140" x2="346" y2="140" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="350" y="112" width="230" height="56" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="465" y="146" text-anchor="middle" font-size="17" fill="#690037">POST /assistant/voice</text>
    <line x1="580" y1="140" x2="636" y2="140" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="640" y="85" width="520" height="110" rx="16" fill="#690037"/>
    <rect x="662" y="102" width="112" height="28" rx="14" fill="#FAB9FF"/>
    <text x="718" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#690037" letter-spacing="1">FACADE</text>
    <text x="662" y="163" font-size="22" font-weight="700" fill="#FFFFFF">AssistantService</text>
    <text x="662" y="184" font-size="15" fill="#FFFFFF">coordena as três etapas numa chamada só</text>

    <path d="M900 195 V222 M210 222 H990" stroke="#690037" stroke-width="2.5" fill="none"/>
    <line x1="210" y1="222" x2="210" y2="246" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="600" y1="222" x2="600" y2="246" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="990" y1="222" x2="990" y2="246" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="40" y="250" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2"/>
    <circle cx="72" cy="282" r="15" fill="#FA5A50"/><text x="72" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="98" y="289" font-size="19" font-weight="700" fill="#690037">Transcreve o áudio</text>
    <text x="60" y="325" font-size="15" fill="#690037">TranscriptionModel</text>
    <text x="60" y="349" font-size="15" fill="#6B4A5A">Whisper, rodando na Groq</text>

    <rect x="430" y="250" width="340" height="120" rx="14" fill="#FAB9FF"/>
    <circle cx="462" cy="282" r="15" fill="#690037"/><text x="462" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="488" y="289" font-size="19" font-weight="700" fill="#690037">Entende o pedido</text>
    <text x="450" y="325" font-size="15" fill="#690037">BudgetAssistant · ChatClient</text>
    <text x="450" y="349" font-size="15" fill="#690037">LLM na Groq + memória da conversa</text>

    <rect x="820" y="250" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#FA5A50" stroke-width="2"/>
    <circle cx="852" cy="282" r="15" fill="#FA5A50"/><text x="852" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="878" y="289" font-size="19" font-weight="700" fill="#690037">Salva a interação</text>
    <text x="840" y="325" font-size="15" fill="#690037">InteractionRepository</text>
    <text x="840" y="349" font-size="15" fill="#6B4A5A">o que foi dito + a resposta</text>

    <line x1="600" y1="370" x2="600" y2="416" stroke="#690037" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#seta)"/>

    <text x="60" y="444" font-size="19" font-weight="700" fill="#690037">Tool Calling</text>
    <text x="60" y="472" font-size="15" fill="#6B4A5A">a IA escolhe qual função usar,</text>
    <text x="60" y="494" font-size="15" fill="#6B4A5A">e o Spring executa o código de verdade</text>

    <rect x="430" y="420" width="340" height="96" rx="14" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <rect x="450" y="436" width="104" height="26" rx="13" fill="#690037"/>
    <text x="502" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">ADAPTER</text>
    <text x="566" y="455" font-size="18" font-weight="700" fill="#690037">BudgetTools · @Tool</text>
    <text x="450" y="496" font-size="15" fill="#6B4A5A">registrar, resumir o mês, listar</text>
    <line x1="770" y1="468" x2="816" y2="468" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="820" y="420" width="340" height="96" rx="14" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="840" y="458" font-size="18" font-weight="700" fill="#690037">TransactionService</text>
    <text x="840" y="490" font-size="15" fill="#6B4A5A">valida os dados e calcula o saldo</text>
    <line x1="990" y1="516" x2="990" y2="540" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <path d="M920 556 V598 A70 13 0 0 0 1060 598 V556" fill="#FAB9FF"/>
    <ellipse cx="990" cy="556" rx="70" ry="13" fill="#F5A3F7" stroke="#FAB9FF" stroke-width="1"/>
    <text x="990" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#690037">PostgreSQL</text>

    <text x="40" y="652" font-size="14" fill="#6B4A5A">depois, a resposta em voz</text>

    <rect x="40" y="666" width="230" height="56" rx="12" fill="#FA5A50"/>
    <text x="155" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">201 · resposta em texto</text>
    <line x1="270" y1="694" x2="316" y2="694" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="320" y="666" width="330" height="56" rx="12" fill="#FFFFFF" stroke="#690037" stroke-width="2"/>
    <text x="485" y="700" text-anchor="middle" font-size="16" fill="#690037">GET /interactions/{id}/speech</text>
    <line x1="650" y1="694" x2="696" y2="694" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="700" y="666" width="310" height="56" rx="12" fill="#FAB9FF"/>
    <text x="855" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#690037">TextToSpeechModel · ElevenLabs</text>
    <line x1="1010" y1="694" x2="1036" y2="694" stroke="#690037" stroke-width="2.5" marker-end="url(#seta)"/>

    <rect x="1040" y="666" width="120" height="56" rx="28" fill="#690037"/>
    <path d="M1072 682 L1072 706 L1092 694 Z" fill="#FFFFFF"/>
    <text x="1104" y="700" font-size="16" font-weight="700" fill="#FFFFFF">MP3</text>

    <path d="M1 746 H1199 V771 A18 18 0 0 1 1181 789 H19 A18 18 0 0 1 1 771 Z" fill="#FAB9FF"/>
    <text x="600" y="773" text-anchor="middle" font-size="15" fill="#690037">Trocar Groq e ElevenLabs pela OpenAI muda só o application.properties: o código depende das interfaces do Spring AI.</text>
  </g>
</svg>
